apiVersion: apps/v1
kind: Deployment
metadata:
  name: eugene-app
  labels:
    app.kubernetes.io/name: eugene-app
    app.kubernetes.io/instance: eugene-app
    app.kubernetes.io/part-of: eugene-app
    app.openshift.io/runtime: react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eugene-app
  template:
    metadata:
      labels:
        app: eugene-app
        app.kubernetes.io/name: eugene-app
        app.kubernetes.io/instance: eugene-app
        app.kubernetes.io/part-of: eugene-app
        app.openshift.io/runtime: react
    spec:
      securityContext:
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eugene-app
          image: ghcr.io/jordanpasildo-tmx-org/creation-test:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eugene-app
  labels:
    app.kubernetes.io/name: eugene-app
    app.kubernetes.io/part-of: eugene-app
    app.openshift.io/runtime: react
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: eugene-app
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eugene-app
  labels:
    app.kubernetes.io/name: eugene-app
    app.kubernetes.io/part-of: eugene-app
    app.openshift.io/runtime: react
spec:
  to:
    kind: Service
    name: eugene-app
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
